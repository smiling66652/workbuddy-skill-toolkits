<!-- 特性展示区模板 — 图文交替布局，适合产品亮点、服务优势展示 -->
<style>
  :root {
    --color-primary: #2563eb;
    --color-bg: #ffffff;
    --color-bg-secondary: #f8fafc;
    --color-text: #0f172a;
    --color-text-secondary: #475569;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .features { padding: 5rem 0; font-family: var(--font-sans); }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
  .feature-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
    padding: 3rem 0;
  }
  .feature-row.reverse { direction: rtl; }
  .feature-row.reverse .feature-text { direction: ltr; }
  .feature-tag {
    display: inline-block; padding: 0.25rem 0.75rem;
    background: rgba(37, 99, 235, 0.1); color: var(--color-primary);
    border-radius: 9999px; font-size: 0.875rem; font-weight: 500; margin-bottom: 1rem;
  }
  .feature-text h3 { font-size: 1.875rem; font-weight: 800; color: var(--color-text); margin: 0 0 1rem; line-height: 1.3; }
  .feature-text p { font-size: 1.0625rem; color: var(--color-text-secondary); line-height: 1.75; margin: 0 0 1.5rem; }
  .feature-list { list-style: none; padding: 0; margin: 0 0 1.5rem; }
  .feature-list li { 
    padding: 0.5rem 0; color: var(--color-text-secondary);
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.938rem;
  }
  .feature-list li::before { content: "✓"; color: var(--color-primary); font-weight: 700; }
  .feature-visual {
    background: linear-gradient(135deg, #eff6ff 0%, #eef2ff 100%);
    border-radius: 1rem;
    display: flex; align-items: center; justify-content: center;
    min-height: 360px;
    color: #94a3b8; font-size: 1.25rem;
  }
  .feature-visual img { width: 100%; height: 100%; object-fit: cover; border-radius: 1rem; }
  .divider { border: none; border-top: 1px solid #e2e8f0; margin: 0; }

  @media (max-width: 768px) {
    .feature-row { grid-template-columns: 1fr; gap: 2rem; }
    .feature-row.reverse { direction: ltr; }
    .feature-visual { min-height: 240px; }
  }
</style>

<section class="features">
  <div class="container">
    <!-- Feature 1: 图左文右 -->
    <div class="feature-row">
      <div class="feature-visual">
        <img src="https://placehold.co/600x400/e2e8f0/64748b?text=Feature+1" alt="功能展示">
      </div>
      <div class="feature-text">
        <div class="feature-tag">核心优势</div>
        <h3>智能自动化工作流</h3>
        <p>通过可视化拖拽，轻松构建自动化流程。减少重复操作，让团队专注于高价值工作。</p>
        <ul class="feature-list">
          <li>可视化流程编辑器，零代码上手</li>
          <li>100+ 预置自动化模板</li>
          <li>实时监控与异常告警</li>
        </ul>
      </div>
    </div>
    <hr class="divider">
    <!-- Feature 2: 图右文左 -->
    <div class="feature-row reverse">
      <div class="feature-visual">
        <img src="https://placehold.co/600x400/e2e8f0/64748b?text=Feature+2" alt="功能展示">
      </div>
      <div class="feature-text">
        <div class="feature-tag">深度洞察</div>
        <h3>实时数据仪表盘</h3>
        <p>自定义数据看板，多维度追踪关键指标。数据驱动决策，让每一步都有据可依。</p>
        <ul class="feature-list">
          <li>拖拽式看板搭建，自由组合图表</li>
          <li>实时数据更新，秒级刷新</li>
          <li>一键导出报告，多格式支持</li>
        </ul>
      </div>
    </div>
    <hr class="divider">
    <!-- Feature 3: 图左文右 -->
    <div class="feature-row">
      <div class="feature-visual">
        <img src="https://placehold.co/600x400/e2e8f0/64748b?text=Feature+3" alt="功能展示">
      </div>
      <div class="feature-text">
        <div class="feature-tag">团队协作</div>
        <h3>无缝协同办公</h3>
        <p>多人实时协作编辑，评论与任务分配，让团队沟通成本降至最低。</p>
        <ul class="feature-list">
          <li>实时多人协作，冲突自动合并</li>
          <li>@提及与任务指派</li>
          <li>版本历史与一键回滚</li>
        </ul>
      </div>
    </div>
  </div>
</section>
