<!-- 响应式导航栏模板 — 含 Logo、菜单项、CTA 按钮，移动端汉堡菜单 -->
<style>
  :root {
    --color-primary: #2563eb;
    --color-primary-dark: #1d4ed8;
    --color-bg: #ffffff;
    --color-text: #0f172a;
    --color-text-secondary: #475569;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #e2e8f0;
    font-family: var(--font-sans);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.5rem;
  }
  .nav-logo { font-size: 1.25rem; font-weight: 700; color: var(--color-text); text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; }
  .nav-links a { color: var(--color-text-secondary); text-decoration: none; font-weight: 500; font-size: 0.938rem; transition: color 0.2s; }
  .nav-links a:hover { color: var(--color-primary); }
  .nav-cta {
    padding: 0.5rem 1.25rem;
    background: var(--color-primary); color: #fff;
    border-radius: 0.5rem; text-decoration: none;
    font-weight: 600; font-size: 0.875rem;
    transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--color-primary-dark); }
  .menu-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
  .menu-toggle span { display: block; width: 24px; height: 2px; background: var(--color-text); margin: 5px 0; transition: 0.3s; }

  @media (max-width: 768px) {
    .nav-links, .nav-cta-desktop { display: none; }
    .menu-toggle { display: block; }
    .nav-links.mobile-open {
      display: flex; flex-direction: column; gap: 1rem;
      position: absolute; top: 100%; left: 0; right: 0;
      background: #fff; padding: 1.5rem; border-bottom: 1px solid #e2e8f0;
    }
  }
</style>

<nav class="navbar">
  <div class="nav-inner">
    <a href="#" class="nav-logo">YourBrand</a>
    <ul class="nav-links" id="navMenu">
      <li><a href="#">产品</a></li>
      <li><a href="#">功能</a></li>
      <li><a href="#">定价</a></li>
      <li><a href="#">关于</a></li>
    </ul>
    <a href="#" class="nav-cta nav-cta-desktop">开始使用</a>
    <button class="menu-toggle" onclick="document.getElementById('navMenu').classList.toggle('mobile-open')">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
