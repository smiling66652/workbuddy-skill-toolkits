<!-- CTA 行动号召区模板 — 用于页面底部或关键转化节点 -->
<style>
  :root {
    --color-primary: #2563eb;
    --color-primary-dark: #1d4ed8;
    --color-text: #0f172a;
    --color-text-secondary: #475569;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .cta {
    padding: 5rem 1.5rem;
    font-family: var(--font-sans);
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    text-align: center;
  }
  .cta-inner { max-width: 640px; margin: 0 auto; }
  .cta h2 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 800; color: #fff;
    margin: 0 0 1rem; line-height: 1.25;
  }
  .cta p {
    font-size: 1.125rem; color: rgba(255,255,255,0.85);
    line-height: 1.75; margin: 0 auto 2rem;
  }
  .cta-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn-white {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.875rem 2rem;
    background: #fff; color: var(--color-primary);
    border-radius: 0.5rem; font-size: 1rem; font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn-white:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .btn-outline-white {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.875rem 2rem;
    background: transparent; color: #fff;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 0.5rem; font-size: 1rem; font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn-outline-white:hover { border-color: #fff; }

  /* 浅色背景变体 */
  .cta.light {
    background: #f8fafc;
  }
  .cta.light h2 { color: var(--color-text); }
  .cta.light p { color: var(--color-text-secondary); }
  .cta.light .btn-white {
    background: var(--color-primary); color: #fff;
  }
  .cta.light .btn-white:hover { background: var(--color-primary-dark); }
  .cta.light .btn-outline-white {
    border-color: var(--color-primary); color: var(--color-primary);
  }
  .cta.light .btn-outline-white:hover { background: var(--color-primary); color: #fff; }
</style>

<section class="cta">
  <div class="cta-inner">
    <h2>准备好开始了吗？</h2>
    <p>加入 10,000+ 团队，用更智能的方式工作。免费试用 14 天，无需信用卡。</p>
    <div class="cta-buttons">
      <a href="#" class="btn-white">免费开始使用 →</a>
      <a href="#" class="btn-outline-white">预约演示</a>
    </div>
  </div>
</section>
